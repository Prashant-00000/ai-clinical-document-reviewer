services:
  - type: web
    name: clinical-document-reviewer-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MODEL_NAME
        value: gemini-3.5-flash-lite
      - key: MAX_UPLOAD_MB
        value: 10
      - key: MAX_PDF_PAGES
        value: 6
      - key: MAX_TEXT_CHARS
        value: 20000
      - key: RATE_LIMIT_PER_HOUR
        value: 30
      - key: LOG_LEVEL
        value: INFO
